# abloh.yml - read from the PR merge base, so changes are reviewed like code.
# Keys: https://abloh.dev/docs#policy

# % of mechanical breaks in changed lines your tests must catch.
threshold: 70

# true: below threshold fails the check. Blocks merges only if also marked
# required in branch protection.
enforce: true

# The job in your own CI that Abloh's step rides. Abloh reads your workflows to
# pick it and proves the choice by running there; change it to move the step.
# That job runs once per matrix leg, and matrixLeg is the one it rides. Abloh's
# step carries an if: that is true on this leg only, so it measures once.
setup:
  job: ".github/workflows/ci.yml::ci"
  matrixLeg:
    node: "22"
    os: "ubuntu-latest"

# Rebuild recipe for the proof container. Comments name the source file.
environment:
  runtimeImage: "node:22.23.1-bookworm-slim@sha256:6c74791e557ce11fc957704f6d4fe134a7bc8d6f5ca4403205b2966bd488f6b3"  # reviewed Node 22 image (.nvmrc)
  runtimes:        # pinned runtimes added to the proof image, installed at build time
    # package.json runs bun in scripts.test:bun, which the Node proof image does not carry
    - "bun"
    # package.json runs deno in scripts.bench, which the Node proof image does not carry
    - "deno"
  installDirectory: "."
  setup: ".abloh/setup.sh"           # written by init and yours to edit. Every cold run executes it step by step
  testCommand: "corepack pnpm test"  # scripts.test in package.json
  # no sealedTestCommand - your test script fans out to other commands rather than running a test runner, so Abloh has none to invoke on its own. Name the way one suite is run here and proposed tests are proved with that.
  identityFiles:   # a change here triggers reinstall instead of container reuse
    - ".npmrc"
