name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ 20, 22, 24 ]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: npm i -fg corepack && corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - uses: oven-sh/setup-bun@v2
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
        with:
          deno-version: v2.x
      - run: pnpm install
      - run: pnpm lint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
      - run: pnpm build
      - run: pnpm vitest run ${{ matrix.node != 18 && '--coverage' || '' }}
      - run: pnpm test:node-register
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
      - run: pnpm test:bun --coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
      - run: pnpm test:native
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == 22 }}
      - name: nightly release
        if: |
          matrix.os == 'ubuntu-latest' && matrix.node == 22 &&
          github.event_name == 'push' &&
          !contains(github.event.head_commit.message, '[skip-release]') &&
          !startsWith(github.event.head_commit.message, 'docs')
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> ~/.npmrc &&
          pnpm changelogen --canary nightly --publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      # Abloh. It runs last, so it measures inside the tree the steps above just built,
      # and rebuilds nothing of yours. It installs its own CLI - and its own Node, if
      # this runner's is older than 20.6 - under RUNNER_TEMP, leaving your PATH alone.
      # The if: runs it even when an earlier step of yours failed, so it says so rather
      # than vanishing. It reports on this pull request and gates nothing until merge,
      # and it files none of that itself - the abloh-publish job below does, because
      # this job holds no permission to. Pinned to a commit; a tag can be moved.
      # The rest of the if: pins it to the one leg named in abloh.yml's setup.matrixLeg,
      # so this job still fans out and Abloh measures once instead of once per leg.
      - name: Abloh
        if: ${{ !cancelled() && matrix.node == '22' && matrix.os == 'ubuntu-latest' }}
        uses: kkennethlau12393/abloh-action-census@19898e0428e04d54c7aef8a6d83a8057a2520cfb
        with:
          # ADDED BY THE ABLOH FIRST-CONTACT CENSUS: this run measures a build of the product
          # rather than the published CLI. Recorded in every row this workflow produced.
          cli-tarball: .abloh-census/engine/abloh-cli-0.1.4.tgz .abloh-census/engine/abloh-core-0.1.3.tgz .abloh-census/engine/abloh-engine-python-0.1.2.tgz .abloh-census/engine/abloh-engine-stryker-0.1.3.tgz .abloh-census/engine/abloh-engine-v2-0.1.0.tgz .abloh-census/engine/abloh-replay-0.1.0.tgz .abloh-census/engine/abloh-sandbox-0.1.2.tgz .abloh-census/engine/abloh-stryker-angular-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-ava-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-bun-runner-0.1.0.tgz .abloh-census/engine/abloh-stryker-node-test-runner-0.1.0.tgz .abloh-census/engine/abloh-triage-0.1.2.tgz
          base: ${{ github.event.pull_request.base.sha }}
          job-status: ${{ job.status }}
          publish: attestation-job
      # ---------------------------------------------------------------------------------
      # ADDED BY THE ABLOH FIRST-CONTACT CENSUS, and these are the only lines of this file
      # that are not what `abloh init` wrote. It keeps the run's own artifact so the
      # census can classify from evidence rather than from this job's log. It runs after
      # everything Abloh does and cannot reach what was measured.
      # ---------------------------------------------------------------------------------
      - name: census - keep the run artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: abloh-census-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-results.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/attest-summary.md
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-engine-v2-proofs.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-summary.json
            ${{ runner.temp }}/abloh/${{ github.run_id }}-${{ github.run_attempt }}/abloh-sweep-preceding-refusal.json
          if-no-files-found: ignore
          retention-days: 30
  # Abloh's publish job. It runs no code of yours, builds nothing and measures nothing:
  # it takes the report the Abloh step above left on this run and files it.
  #
  # It is a separate job because GitHub grants id-token: write to a whole JOB and
  # not to one step: putting it on the job above would hand the same identity to every
  # step that runs there, Abloh's and everybody else's. Here it reaches Abloh's step
  # and nothing else. It authorizes one thing, filing this report with Abloh, and
  # carries no write access to your repository. Declaring the block below takes no
  # grant away from anything, because this job is new and had none.
  abloh-publish:
    needs: ci
    # Runs even when the job above failed - a trial that stopped is the report you need.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Abloh publish
        uses: kkennethlau12393/abloh-action-census/attest@19898e0428e04d54c7aef8a6d83a8057a2520cfb
